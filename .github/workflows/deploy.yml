# -----------------------------------------------------------------------------
# Push-to-deploy for https://itdservices.in
# -----------------------------------------------------------------------------
# Every push to `main` SSHs into the droplet as `deploy` and runs `git pull`
# in the live folder — the same steps as the manual process:
#   ssh deploy@159.65.154.129
#   cd static-sites/ITD_SOFTWARE_NEW
#   git pull
# Files only — PHP, nginx and server config are never touched.
#
# Requires repo secrets: SSH_HOST, SSH_USER, SSH_PORT, SSH_PRIVATE_KEY.
# Until those exist this job fails harmlessly; deploy manually instead.
# -----------------------------------------------------------------------------

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-itdservices
  cancel-in-progress: false

jobs:
  deploy:
    name: Push to itdservices.in
    runs-on: ubuntu-latest
    steps:
      - name: SSH → git pull
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port:     ${{ secrets.SSH_PORT }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -e
            cd ~/static-sites/ITD_SOFTWARE_NEW
            git pull --ff-only origin main
            echo "✓ Live now at: $(git log -1 --format='%h %s')"
